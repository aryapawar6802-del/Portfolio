<text x="116" y="522" font-family="'Inter Tight', Helvetica, Arial, sans-serif" font-size="15" fill="#1A1917" font-weight="500" text-anchor="start" letter-spacing="0" opacity="1">Department</text>
<text x="116" y="541" font-family="'Inter Tight', Helvetica, Arial, sans-serif" font-size="12" fill="#6F6A62" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">calibrated</text>
<rect x="100" y="569" width="260" height="62" rx="9" fill="#fff" stroke="#1A1917" stroke-width="1.6"/>
<path d="M332 600 h16" stroke="#C4442E" stroke-width="1.8" marker-end="url(#aa)"/>
<text x="116" y="596" font-family="'Inter Tight', Helvetica, Arial, sans-serif" font-size="15" fill="#1A1917" font-weight="500" text-anchor="start" letter-spacing="0" opacity="1">Category Group</text>
<text x="116" y="615" font-family="'Inter Tight', Helvetica, Arial, sans-serif" font-size="12" fill="#6F6A62" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">open, start here</text>
<rect x="100" y="643" width="260" height="62" rx="9" fill="none" stroke="#6F6A62" stroke-width="1.2" stroke-dasharray="4 4"/>
<path d="M336 668 v-3 a4 4 0 0 1 8 0 v3" fill="none" stroke="#6F6A62" stroke-width="1.5"/><rect x="334" y="668" width="12" height="9" rx="2" fill="#6F6A62"/>
<text x="116" y="670" font-family="'Inter Tight', Helvetica, Arial, sans-serif" font-size="15" fill="#1A1917" font-weight="500" text-anchor="start" letter-spacing="0" opacity="0.5">Category</text>
<text x="116" y="689" font-family="'Inter Tight', Helvetica, Arial, sans-serif" font-size="12" fill="#6F6A62" font-weight="400" text-anchor="start" letter-spacing="0" opacity="0.5">locked until the level above is done</text>
<text x="80" y="774" font-family="'Inter Tight', Helvetica, Arial, sans-serif" font-size="13.5" fill="#6F6A62" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">On return, home doubles as a progress tracker.</text>
<text x="80" y="794" font-family="'Inter Tight', Helvetica, Arial, sans-serif" font-size="13.5" fill="#6F6A62" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">Only the next step that’s safe to take is open.</text>
<path d="M382 600 C 412 600, 408 462, 436 462" fill="none" stroke="#1A1917" stroke-width="1.3" marker-end="url(#ar)"/>
<rect x="440" y="330" width="155" height="270" rx="14" fill="#fff" stroke="#1A1917" stroke-width="1.3"/>
<text x="456" y="360" font-family="'JetBrains Mono', Menlo, monospace" font-size="12" fill="#C4442E" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">a</text>
<text x="456" y="392" font-family="Newsreader, Georgia, serif" font-size="23" fill="#1A1917" font-weight="400" text-anchor="start" letter-spacing="-0.3" opacity="1">Summary</text>
<text x="456" y="422" font-family="Newsreader, Georgia, serif" font-size="16" fill="#1A1917" font-weight="400" font-style="italic" text-anchor="start" letter-spacing="0" opacity="1">“What needs me?”</text>
<line x1="456" y1="466" x2="579" y2="466" stroke="#DAD6CD"/>
<text x="456" y="490" font-family="'Inter Tight', Helvetica, Arial, sans-serif" font-size="12.5" fill="#6F6A62" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">Names what’s blocked</text>
<text x="456" y="508" font-family="'Inter Tight', Helvetica, Arial, sans-serif" font-size="12.5" fill="#6F6A62" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">in one sentence. Rule</text>
<text x="456" y="526" font-family="'Inter Tight', Helvetica, Arial, sans-serif" font-size="12.5" fill="#6F6A62" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">violations become a</text>
<text x="456" y="544" font-family="'Inter Tight', Helvetica, Arial, sans-serif" font-size="12.5" fill="#6F6A62" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">short triage list.</text>
<rect x="615" y="330" width="155" height="270" rx="14" fill="#fff" stroke="#1A1917" stroke-width="1.3"/>
<text x="631" y="360" font-family="'JetBrains Mono', Menlo, monospace" font-size="12" fill="#C4442E" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">b</text>
<text x="631" y="392" font-family="Newsreader, Georgia, serif" font-size="23" fill="#1A1917" font-weight="400" text-anchor="start" letter-spacing="-0.3" opacity="1">Compare</text>
<text x="631" y="422" font-family="Newsreader, Georgia, serif" font-size="16" fill="#1A1917" font-weight="400" font-style="italic" text-anchor="start" letter-spacing="0" opacity="1">“Why did this</text>
<text x="631" y="442" font-family="Newsreader, Georgia, serif" font-size="16" fill="#1A1917" font-weight="400" font-style="italic" text-anchor="start" letter-spacing="0" opacity="1">number move?”</text>
<line x1="631" y1="466" x2="754" y2="466" stroke="#DAD6CD"/>
<text x="631" y="490" font-family="'Inter Tight', Helvetica, Arial, sans-serif" font-size="12.5" fill="#6F6A62" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">Last month, calibrated,</text>
<text x="631" y="508" font-family="'Inter Tight', Helvetica, Arial, sans-serif" font-size="12.5" fill="#6F6A62" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">and raw, side by side</text>
<text x="631" y="526" font-family="'Inter Tight', Helvetica, Arial, sans-serif" font-size="12.5" fill="#6F6A62" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">on every metric.</text>
<rect x="790" y="330" width="155" height="270" rx="14" fill="#fff" stroke="#1A1917" stroke-width="1.3"/>
<text x="806" y="360" font-family="'JetBrains Mono', Menlo, monospace" font-size="12" fill="#C4442E" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">c</text>
<text x="806" y="392" font-family="Newsreader, Georgia, serif" font-size="23" fill="#1A1917" font-weight="400" text-anchor="start" letter-spacing="-0.3" opacity="1">Edit</text>
<text x="806" y="422" font-family="Newsreader, Georgia, serif" font-size="16" fill="#1A1917" font-weight="400" font-style="italic" text-anchor="start" letter-spacing="0" opacity="1">“Can I change it</text>
<text x="806" y="442" font-family="Newsreader, Georgia, serif" font-size="16" fill="#1A1917" font-weight="400" font-style="italic" text-anchor="start" letter-spacing="0" opacity="1">safely?”</text>
<line x1="806" y1="466" x2="929" y2="466" stroke="#DAD6CD"/>
<text x="806" y="490" font-family="'Inter Tight', Helvetica, Arial, sans-serif" font-size="12.5" fill="#6F6A62" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">Changes are saved or</text>
<text x="806" y="508" font-family="'Inter Tight', Helvetica, Arial, sans-serif" font-size="12.5" fill="#6F6A62" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">discarded on purpose.</text>
<text x="806" y="526" font-family="'Inter Tight', Helvetica, Arial, sans-serif" font-size="12.5" fill="#6F6A62" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">Nothing half-finished</text>
<text x="806" y="544" font-family="'Inter Tight', Helvetica, Arial, sans-serif" font-size="12.5" fill="#6F6A62" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">leaks into a published</text>
<text x="806" y="562" font-family="'Inter Tight', Helvetica, Arial, sans-serif" font-size="12.5" fill="#6F6A62" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">number.</text>
<rect x="965" y="330" width="155" height="270" rx="14" fill="#fff" stroke="#1A1917" stroke-width="1.3"/>
<text x="981" y="360" font-family="'JetBrains Mono', Menlo, monospace" font-size="12" fill="#C4442E" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">d</text>
<text x="981" y="392" font-family="Newsreader, Georgia, serif" font-size="23" fill="#1A1917" font-weight="400" text-anchor="start" letter-spacing="-0.3" opacity="1">Approve</text>
<text x="981" y="422" font-family="Newsreader, Georgia, serif" font-size="16" fill="#1A1917" font-weight="400" font-style="italic" text-anchor="start" letter-spacing="0" opacity="1">“What happens if</text>
<text x="981" y="442" font-family="Newsreader, Georgia, serif" font-size="16" fill="#1A1917" font-weight="400" font-style="italic" text-anchor="start" letter-spacing="0" opacity="1">I commit?”</text>
<line x1="981" y1="466" x2="1104" y2="466" stroke="#DAD6CD"/>
<text x="981" y="490" font-family="'Inter Tight', Helvetica, Arial, sans-serif" font-size="12.5" fill="#6F6A62" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">GMV and share impact</text>
<text x="981" y="508" font-family="'Inter Tight', Helvetica, Arial, sans-serif" font-size="12.5" fill="#6F6A62" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">before you finalise,</text>
<text x="981" y="526" font-family="'Inter Tight', Helvetica, Arial, sans-serif" font-size="12.5" fill="#6F6A62" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">while you can still</text>
<text x="981" y="544" font-family="'Inter Tight', Helvetica, Arial, sans-serif" font-size="12.5" fill="#6F6A62" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">back out.</text>
