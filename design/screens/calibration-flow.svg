<defs>
<marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#1A1917" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="aa" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#C4442E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="1440" height="960" fill="#FCFBF8"/>
<text x="80" y="84" font-family="'JetBrains Mono', Menlo, monospace" font-size="12" fill="#6F6A62" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">Calibration flow</text>
<text x="80" y="132" font-family="Newsreader, Georgia, serif" font-size="38" fill="#1A1917" font-weight="400" text-anchor="start" letter-spacing="-0.6" opacity="1">Every screen answers a question</text>
<text x="80" y="178" font-family="Newsreader, Georgia, serif" font-size="38" fill="#1A1917" font-weight="400" text-anchor="start" letter-spacing="-0.6" opacity="1">the calibrator was already asking.</text>
<text x="1060" y="98" font-family="Newsreader, Georgia, serif" font-size="20" fill="#1A1917" font-weight="400" font-style="italic" text-anchor="start" letter-spacing="0" opacity="1">“ ”</text>
<text x="1100" y="96" font-family="'Inter Tight', Helvetica, Arial, sans-serif" font-size="13" fill="#6F6A62" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">the calibrator’s question</text>
<rect x="1060" y="116" width="28" height="18" rx="4" fill="#fff" stroke="#1A1917" stroke-width="1.2"/>
<text x="1100" y="130" font-family="'Inter Tight', Helvetica, Arial, sans-serif" font-size="13" fill="#6F6A62" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">where the tool answers it</text>
<rect x="1060" y="148" width="28" height="18" rx="4" fill="none" stroke="#6F6A62" stroke-width="1.2" stroke-dasharray="3 3"/>
<text x="1100" y="162" font-family="'Inter Tight', Helvetica, Arial, sans-serif" font-size="13" fill="#6F6A62" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">not reachable yet</text>
<line x1="80" y1="220" x2="1360" y2="220" stroke="#DAD6CD"/>
<text x="80" y="272" font-family="'JetBrains Mono', Menlo, monospace" font-size="13" fill="#C4442E" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">1</text>
<text x="102" y="274" font-family="Newsreader, Georgia, serif" font-size="26" fill="#1A1917" font-weight="400" text-anchor="start" letter-spacing="-0.3" opacity="1">Orient</text>
<text x="440" y="272" font-family="'JetBrains Mono', Menlo, monospace" font-size="13" fill="#C4442E" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">2</text>
<text x="462" y="274" font-family="Newsreader, Georgia, serif" font-size="26" fill="#1A1917" font-weight="400" text-anchor="start" letter-spacing="-0.3" opacity="1">Calibrate the level</text>
<text x="1170" y="272" font-family="'JetBrains Mono', Menlo, monospace" font-size="13" fill="#C4442E" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">3</text>
<text x="1192" y="274" font-family="Newsreader, Georgia, serif" font-size="26" fill="#1A1917" font-weight="400" text-anchor="start" letter-spacing="-0.3" opacity="1">Unlock</text>
<text x="80" y="312" font-family="'Inter Tight', Helvetica, Arial, sans-serif" font-size="13" fill="#6F6A62" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">Coming back to a cycle already underway</text>
<text x="80" y="346" font-family="Newsreader, Georgia, serif" font-size="19" fill="#1A1917" font-weight="400" font-style="italic" text-anchor="start" letter-spacing="0" opacity="1">“What has already been done?”</text>
<text x="80" y="376" font-family="Newsreader, Georgia, serif" font-size="19" fill="#1A1917" font-weight="400" font-style="italic" text-anchor="start" letter-spacing="0" opacity="1">“Where do I start from?”</text>
<line x1="230" y1="390" x2="230" y2="414" stroke="#1A1917" stroke-width="1.3" marker-end="url(#ar)"/>
<rect x="80" y="420" width="300" height="320" rx="14" fill="#fff" stroke="#1A1917" stroke-width="1.3"/>
<text x="100" y="452" font-family="'Inter Tight', Helvetica, Arial, sans-serif" font-size="14" fill="#1A1917" font-weight="500" text-anchor="start" letter-spacing="0" opacity="1">Home</text>
<text x="360" y="452" font-family="'JetBrains Mono', Menlo, monospace" font-size="11" fill="#6F6A62" font-weight="400" text-anchor="end" letter-spacing="0" opacity="1">1 of 6 completed</text>
