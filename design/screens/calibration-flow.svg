<circle cx="1338" cy="362" r="9" fill="#C4442E"/><path d="M1334 362 l3 3 l5 -6" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
<text x="1186" y="358" font-family="'Inter Tight', Helvetica, Arial, sans-serif" font-size="15" fill="#fff" font-weight="500" text-anchor="start" letter-spacing="0" opacity="1">Department</text>
<text x="1186" y="377" font-family="'Inter Tight', Helvetica, Arial, sans-serif" font-size="12" fill="#BDB7AD" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">locked in</text>
<rect x="1170" y="406" width="190" height="64" rx="10" fill="#fff" stroke="#1A1917" stroke-width="1.6"/>
<text x="1186" y="434" font-family="'Inter Tight', Helvetica, Arial, sans-serif" font-size="15" fill="#1A1917" font-weight="500" text-anchor="start" letter-spacing="0" opacity="1">Category Group</text>
<text x="1186" y="453" font-family="'Inter Tight', Helvetica, Arial, sans-serif" font-size="12" fill="#6F6A62" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">unlocks</text>
<rect x="1170" y="482" width="190" height="64" rx="10" fill="none" stroke="#6F6A62" stroke-width="1.2" stroke-dasharray="4 4"/>
<path d="M1334 510 v-3 a4 4 0 0 1 8 0 v3" fill="none" stroke="#6F6A62" stroke-width="1.5"/><rect x="1332" y="510" width="12" height="9" rx="2" fill="#6F6A62"/>
<text x="1186" y="510" font-family="'Inter Tight', Helvetica, Arial, sans-serif" font-size="15" fill="#1A1917" font-weight="500" text-anchor="start" letter-spacing="0" opacity="0.5">Category</text>
<text x="1186" y="529" font-family="'Inter Tight', Helvetica, Arial, sans-serif" font-size="12" fill="#6F6A62" font-weight="400" text-anchor="start" letter-spacing="0" opacity="0.5">waits its turn</text>
<text x="1170" y="584" font-family="'Inter Tight', Helvetica, Arial, sans-serif" font-size="13.5" fill="#6F6A62" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">A finished level can’t be</text>
<text x="1170" y="603" font-family="'Inter Tight', Helvetica, Arial, sans-serif" font-size="13.5" fill="#6F6A62" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">undone by a late edit.</text>
