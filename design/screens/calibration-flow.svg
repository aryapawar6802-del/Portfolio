<line x1="773" y1="560" x2="787" y2="560" stroke="#1A1917" stroke-width="1.3" marker-end="url(#ar)"/>
<line x1="948" y1="560" x2="962" y2="560" stroke="#1A1917" stroke-width="1.3" marker-end="url(#ar)"/>
<line x1="517.5" y1="606" x2="517.5" y2="654" stroke="#C4442E" stroke-width="1.4" stroke-dasharray="4 4" marker-start="url(#aa)" marker-end="url(#aa)"/>
<rect x="458" y="660" width="119" height="40" rx="20" fill="#fff" stroke="#C4442E" stroke-width="1.4"/>
<text x="517.5" y="685" font-family="'Inter Tight', Helvetica, Arial, sans-serif" font-size="14" fill="#C4442E" font-weight="500" text-anchor="middle" letter-spacing="0" opacity="1">Blocked</text>
<text x="596" y="676" font-family="'Inter Tight', Helvetica, Arial, sans-serif" font-size="13" fill="#6F6A62" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">A rule conflict stops the level.</text>
<text x="596" y="694" font-family="'Inter Tight', Helvetica, Arial, sans-serif" font-size="13" fill="#6F6A62" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">Resolve it, then back to the summary.</text>
<line x1="1123" y1="438" x2="1166" y2="438" stroke="#1A1917" stroke-width="1.3" marker-end="url(#ar)"/>
<text x="1144" y="428" font-family="'Inter Tight', Helvetica, Arial, sans-serif" font-size="12" fill="#6F6A62" font-weight="400" text-anchor="middle" letter-spacing="0" opacity="1">finalise</text>
