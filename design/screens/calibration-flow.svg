<rect x="730" y="816" width="220" height="28" fill="#FCFBF8"/>
<text x="840" y="835" font-family="Newsreader, Georgia, serif" font-size="19" fill="#C4442E" font-weight="400" font-style="italic" text-anchor="middle" letter-spacing="0" opacity="1">Next level, same four steps</text>
<line x1="80" y1="890" x2="1360" y2="890" stroke="#DAD6CD"/>
<text x="80" y="922" font-family="'Inter Tight', Helvetica, Arial, sans-serif" font-size="12.5" fill="#6F6A62" font-weight="400" text-anchor="start" letter-spacing="0" opacity="1">Phase 1 calibration</text>
<text x="1360" y="922" font-family="'Inter Tight', Helvetica, Arial, sans-serif" font-size="12.5" fill="#6F6A62" font-weight="400" text-anchor="end" letter-spacing="0" opacity="1">Redrawn from the working whiteboard</text>
